name: XGW Next CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Tkinter for import tests
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Debug
        run: |
          git log --oneline -3
          ls -la
          ls -la editor || echo "SLOZKA editor NEEXISTUJE"
          find . -iname "app_settings*"
          ls -la tests/conftest.py || echo "conftest NEEXISTUJE"
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/editor
        run: python -m pytest tests -v

  cpp-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
