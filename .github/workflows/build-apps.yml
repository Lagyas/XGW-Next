name: Build test applications

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - '.github/workflows/build-apps.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: XGW-Next-Windows
            executable: dist/XGW-Next.exe
          - os: macos-15
            artifact: XGW-Next-macOS
            executable: dist/XGW-Next.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller "mido>=1.3,<2" "python-rtmidi>=1.5,<2"
      - name: Test MIDI core
        run: python -m unittest discover -s tests -v
      - name: Package desktop app
        run: python -m PyInstaller --noconfirm --clean --windowed --name XGW-Next --paths editor editor/app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14
