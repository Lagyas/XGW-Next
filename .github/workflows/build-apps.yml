name: Build test applications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: XGW-Next-Windows.zip
          - os: macos-15
            archive: XGW-Next-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller "mido>=1.3,<2" "python-rtmidi>=1.5,<2" "pytest>=8,<10"
      - name: Test MIDI core
        env:
          PYTHONPATH: editor
        run: python -m pytest tests -q
      - name: Package desktop app (Windows, single EXE)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name XGW-Next --hidden-import mido.backends.rtmidi --collect-submodules mido.backends --collect-submodules rtmidi --paths editor editor/app.py
      - name: Package desktop app (macOS, .app bundle)
        if: runner.os == 'macOS'
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name XGW-Next --hidden-import mido.backends.rtmidi --collect-submodules mido.backends --collect-submodules rtmidi --paths editor editor/app.py
      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/XGW-Next.exe -DestinationPath XGW-Next-Windows.zip
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/XGW-Next.app XGW-Next-macOS.zip
      - name: Publish downloadable build to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_id }}
          ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "XGW Next test build ${{ github.run_id }}" --notes "Automated untested desktop build. Windows and macOS assets are uploaded independently." --prerelease --target "${{ github.sha }}"
          gh release upload "$TAG" "$ARCHIVE" --clobber
